# biblioteca-web: nginx sirve el Angular compilado en el puerto 80 del contenedor.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # /callback y las demas rutas de Angular no son archivos: se responde index.html
  # y decide el router. Sin esto, volver de Cognito a /callback da 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}