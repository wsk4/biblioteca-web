<header>
  <h1>Biblioteca</h1>

  <nav>
    <a
      routerLink="/libros"
      routerLinkActive="activo"
    >
      Catálogo
    </a>

    @if (esBibliotecario()) {
      <a
        routerLink="/prestamos"
        routerLinkActive="activo"
      >
        Préstamos
      </a>
    }

    <button
      type="button"
      (click)="entrar()"
    >
      Entrar
    </button>
  </nav>
</header>

<main>
  <router-outlet />
</main>

<footer>
  <p class="apagado">
    El gateway está en <code>http://localhost:8080</code>. Si esta página no
    muestra datos, revisa que estén corriendo los dos microservicios y el
    gateway.

    <a
      href="https://github.com/Umbingelelo/biblioteca-gateway"
      target="_blank"
      rel="noopener"
    >
      biblioteca-gateway
    </a>
  </p>
</footer>
